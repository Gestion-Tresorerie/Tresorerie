/* Synthèse : relief, anneaux, courbe */
:root{--bgov:rgba(232,237,247,.62);--gk:0;--gl1:rgba(255,255,255,.74);--gl2:rgba(255,255,255,.46);--gl-edge:rgba(40,60,100,.12);--gl-hi:rgba(255,255,255,.9);--gl-sh:0 6px 22px rgba(40,60,110,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bgov:rgba(8,12,26,.46);--gk:1;--gl1:rgba(255,255,255,.10);--gl2:rgba(255,255,255,.03);--gl-edge:rgba(255,255,255,.12);--gl-hi:rgba(255,255,255,.16);--gl-sh:0 10px 30px rgba(0,0,0,.32)}}
:root[data-theme="dark"]{--bgov:rgba(8,12,26,.46);--gk:1;--gl1:rgba(255,255,255,.10);--gl2:rgba(255,255,255,.03);--gl-edge:rgba(255,255,255,.12);--gl-hi:rgba(255,255,255,.16);--gl-sh:0 10px 30px rgba(0,0,0,.32)}
.syn .card,.syn .rtile{background:linear-gradient(160deg,var(--gl1),var(--gl2));border:1px solid var(--gl-edge);box-shadow:var(--gl-sh),inset 0 1px 0 var(--gl-hi);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
.syn .hero.glow{--glow:var(--good);padding-bottom:12px;box-shadow:var(--gl-sh),0 0 44px color-mix(in srgb,var(--glow) calc(var(--gk)*22%),transparent),inset 0 1px 0 var(--gl-hi)}
.syn .hero.gneg{--glow:var(--bad)}
.syn .hero .big{font-size:42px;font-weight:600;text-shadow:0 0 26px color-mix(in srgb,var(--glow) calc(var(--gk)*45%),transparent)}
.spark{margin-top:8px;overflow:visible}
.sparkn{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rtile .rwrap,.rtile .ring{width:84px;height:84px}.rtile .rv{font-size:11.5px;letter-spacing:-.2px}.rtile .rs{font:500 11px var(--mono);color:var(--muted);margin-top:2px;opacity:.85}.rtile .rl{font-size:12px;margin-top:8px}

.dot.g{background:var(--good);box-shadow:0 0 calc(var(--gk)*8px) var(--good)}
.dot.o{background:var(--warn);box-shadow:0 0 calc(var(--gk)*8px) var(--warn)}
.dot.r{background:var(--bad);box-shadow:0 0 calc(var(--gk)*8px) var(--bad)}
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes rg{from{stroke-dashoffset:var(--L)}}
.syn.an>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.syn.an>:nth-child(2){animation-delay:.06s}.syn.an>:nth-child(3){animation-delay:.12s}.syn.an>:nth-child(4){animation-delay:.18s}.syn.an>:nth-child(5){animation-delay:.24s}.syn.an>:nth-child(6){animation-delay:.3s}.syn.an>:nth-child(7){animation-delay:.36s}

}

.head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;padding:10px 16px}
.head .brand{justify-self:center;align-self:center;line-height:0}
.head .brand img{display:block;margin:0}
.head .monthnav{justify-self:center;gap:0}
.head .monthnav .ib{width:34px;height:40px;flex:none}
.head .monthnav h1{width:114px;min-width:0;padding:0;white-space:nowrap;font-size:15px;line-height:1;text-align:center}
.head #status{justify-self:end;max-width:100%;min-width:0;font-size:11.5px;padding:6px 8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
/* Charges : même UX que Synthèse */
.fxh{display:flex;align-items:center;gap:16px}
.fxh .rwrap{flex:none}
.fxh .stat{min-width:0}
.lbl2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bigv{font:600 24px var(--mono);margin:4px 0 2px;letter-spacing:-.02em}
.bigv .muted{font-size:14px;font-weight:400}
.syn .grp{margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);align-items:center}
.syn .grp b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.syn .grp .gc{margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);font-size:11px;letter-spacing:0;color:var(--ink)}
.syn .grp .n{font-size:14px;color:var(--ink)}
.syn .row{border-top:0;border-bottom:1px solid var(--line)}
.syn .row:last-child{border-bottom:0}
.row .nm{display:block;font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.row.is-done .nm{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;line-height:1.25;padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-weight:500;color:var(--muted)}
.tag.tg{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.tag.tw{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tag.tb{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.lnk{background:transparent;border:1px dashed var(--border-strong,var(--line));color:var(--accent)}
.form .add{grid-column:1/-1;justify-self:end;width:auto;min-height:40px;padding:8px 22px;font-size:14px;border-radius:12px}
.head .monthnav h1{width:132px}
/* Tous les onglets : même UX */
.syn .kpi,.syn .hrow{background:linear-gradient(160deg,var(--gl1),var(--gl2));border:1px solid var(--gl-edge);box-shadow:var(--gl-sh),inset 0 1px 0 var(--gl-hi);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
.syn .kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.syn .kpi .v{font-family:var(--mono);font-weight:600}
.line .nm{display:block;font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.line .t{min-width:0}
.syn .btn{min-height:40px;padding:8px 16px;font-size:14px;border-radius:12px;font-weight:500}
.syn .btn.mini{min-height:0;padding:4px 10px;font-size:12px;border-radius:8px}
.syn .form .btn.full{grid-column:1/-1;width:auto;justify-self:end;padding:8px 22px}
.syn .chip.seg{font-size:13px;padding:6px 12px}
.grid2>*{min-width:0}
.grid2 input{width:100%;min-width:0}
.ro [data-ed],.ro [data-lk],.ro [data-fx],.ro [data-bs],.ro [data-act="del"]{pointer-events:none}
.ro input:disabled,.ro select:disabled{opacity:.8;-webkit-text-fill-color:currentColor}
.ro .btn:disabled,.ro .x:disabled{opacity:.4}
.kp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kp3 .kpi{padding:10px}.kp3 .kpi .v{font-size:15px}
.kp3 .kpi .l{white-space:nowrap;letter-spacing:.06em}
.msec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 4px 2px}
.mgh{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;background:none;border:0;padding:2px 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mgh>span:first-child{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mgh .gc{margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);font-size:11px;letter-spacing:0}
.mgh .n{font:600 14px var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chev{display:inline-block;font-size:18px;color:var(--muted);transform:rotate(90deg);transition:transform .2s;margin-left:4px}.chev.up{transform:rotate(-90deg)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{margin-top:8px}.mrow .t{display:flex;flex-direction:column;gap:5px;min-width:0}.mrow .nm{font-weight:600;font-size:15px;line-height:1.25}.mrow .n{font:600 15px var(--mono);white-space:nowrap}
.edsh{display:grid;gap:8px;padding:4px 0 14px}.edsh .edbt{display:flex;gap:8px}
input.num,.row input.num,input[name=amount]{min-height:34px;height:34px;padding:0 10px;font-size:16px;line-height:1;border-radius:8px;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:none}
input.num:focus,input[name=amount]:focus{background:color-mix(in srgb,var(--ink) 10%,transparent);border-color:var(--accent)}
.row{min-height:52px;padding:8px 0}
.kp3{align-items:stretch}
.form input:not([type=hidden]),.form select{height:40px;min-height:40px;padding:0 12px;border-radius:10px;font-size:16px;background:var(--bg);border:1px solid var(--line)}
.form input[type=date]{padding:0 10px}
.adh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;min-height:34px}
.adh>span:first-child{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.adb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.ad .adbody{margin-top:12px}.ad:not(.open) .adbody{display:none}
.card.ad{padding-top:12px;padding-bottom:12px}.card.ad.open{padding-bottom:16px}
.adin{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.rings.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.envt{cursor:default;padding:14px 8px 12px}
.envin{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
.envin input.num{width:88px;min-height:32px;height:32px;padding:0 8px;font-size:15px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hyr{width:auto;min-height:32px;height:32px;padding:0 28px 0 12px;font-size:14px;border-radius:16px}

body{padding-bottom:28px}
.tabbar{position:fixed;top:0;bottom:0;left:0;right:auto;width:min(80vw,290px);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;border-top:0;border-right:1px solid var(--glass-b);padding:calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));z-index:20;overflow-y:auto;background:var(--page)}
.menu-open .tabbar{transform:none;visibility:visible;transition:transform .25s ease}
.tabbar nav{flex-direction:column;max-width:none;width:100%}
.tabbar button{flex:none;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:14px 20px;font-size:16px;text-align:left;border-top:0;border-left:3px solid transparent}
.tabbar button[aria-current="page"]{border-top:0;border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tabbar svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dbrand{display:flex;align-items:center;gap:10px;padding:4px 20px 16px;font-size:16px}.dbrand img{width:38px;height:38px;display:block}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
.menu-open #scrim{opacity:1;pointer-events:auto}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.brow>.btn{width:100%;margin:0;padding-left:6px;padding-right:6px;text-align:center;line-height:1.25}.brow>.btn:last-child:nth-child(odd){grid-column:1/-1}
/* hiérarchie titres / détails */
.card h2{display:block;font-size:15px;font-weight:700;letter-spacing:.07em;color:var(--ink);margin:0 0 14px;padding:0 0 10px;border-bottom:2px solid var(--line)}
.card h2::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:var(--accent);margin-right:9px;vertical-align:-2px}
.card h2 .x{float:right}
.card .grp{margin:16px 0 6px;padding:5px 9px;border-left:3px solid var(--accent);background:var(--line);border-radius:0 8px 8px 0}
.card .grp b{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.card>.grp:first-child{margin-top:0}
.line .nm,.row .nm,.mrow .nm{font-weight:500}
.line .small,.line .tags{opacity:.85}
#persoBtn[hidden]{display:none!important}
.pseg{display:flex;gap:4px;margin:0 0 12px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-x:auto}.pseg button{flex:1;white-space:nowrap;font:inherit;font-size:13px;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}.pseg button[aria-selected=true]{background:var(--accent);color:#fff;font-weight:600}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px}.phead .btn{flex:0 0 auto}
.pop{padding:10px 0;border-bottom:1px solid var(--line)}.pop:last-child{border-bottom:0}.pop1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.pop1 .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}.pop2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}.pop2 select{flex:0 0 52%;min-width:0}

</style>

(function(){

    credits:c.credits.map(function(t){return {id:uid(),tid:t.id,label:t.label,who:t.who,planned:t.amount||0,actual:t.kind?null:t.amount,done:false,kind:t.kind||null}}),

document.addEventListener('click',function(e){var b=e.target.closest('[data-ad]');if(!b||b.disabled)return;var c=b.closest('.ad'),o=c.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');b.querySelector('.adb').textContent=o?'×':'+';if(o){var i=c.querySelector('input:not([type=hidden])');if(i)i.focus()}});
function getM(key){return state.months[key]||virt[key]||(virt[key]=build(key))}

/* report automatique : ligne fixe non payée d'un mois passé -> mois courant, jusqu'à ce qu'elle soit cochée */
var CUR=ym;
function carryFor(key){
  var out={},inc=[],from={},outN=0;
  Object.keys(state.months).forEach(function(j){
    state.months[j].fixed.forEach(function(x){

}

  var m=getM(key),cf=carryFor(key);

}

/* ---------- calculs ---------- */
function isX(x){return x.xtra===true||(!x.tid&&x.xtra!==false&&!/^s\d{6}\d+$/.test(x.id||'')&&!/demi.?pension|cantine/i.test(x.label||''))}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function shares(m){
  var cfg=state.config;
  var base=sum(m.fixed,function(x){return x.planned})+(m.courses.planned||0);
  var mi=(m.incomes&&m.incomes.length===2)?m.incomes:cfg.incomes;
  var i0=num(mi[0]),i1=num(mi[1]),tot=i0+i1,known=tot>0;
  var p0=known?i0/tot:0.5;
  var s0=Math.round(base*p0*100)/100,s1=Math.round((base-s0)*100)/100;
  var sf=num(cfg.salaryFirst),first=(i0>0&&sf>0)?Math.round(s0*Math.min(sf,i0)/i0*100)/100:s0;
  var l1=null;m.credits.forEach(function(x){if(x.kind==='paf1')l1=x});
  var firstUsed=(l1&&l1.done&&l1.actual!=null)?l1.actual:first;
  var second=Math.max(0,Math.round((s0-firstUsed)*100)/100);
  return {base:base,known:known,p:[p0,1-p0],share:[s0,s1],income:[i0,i1],first:first,firstUsed:firstUsed,second:second,salFirst:Math.min(num(cfg.salaryFirst),i0),salRest:Math.max(0,Math.round((i0-num(cfg.salaryFirst))*100)/100),over:[i0>0&&s0>i0,i1>0&&s1>i1]};
}
function eff(x,S){
  if(x.kind==='paf1')return S.first;
  if(x.kind==='paf2')return S.second;
  if(x.kind==='paf'){var i=state.config.contributors.indexOf(x.who);return S.share[i===0?0:1]}
  return x.planned;
}
function act(x,S){return x.actual!=null?x.actual:eff(x,S)}
function calc(m){
  var r={};var S=shares(m);r.S=S;
  r.creditsPlanned=sum(m.credits,function(x){return eff(x,S)});
  r.creditsReal=sum(m.credits,function(x){return x.done?act(x,S):0});
  r.incProj=sum(m.credits,function(x){return x.done?act(x,S):eff(x,S)});
  r.incProj+=sum(m.credits,function(x){return (x.kind&&x.done)?Math.max(0,eff(x,S)-act(x,S)):0});
  r.fixedPlanned=sum(m.fixed,function(x){return x.planned});
  r.fixedPaid=sum(m.fixed,function(x){return x.paid?x.actual:0});
  r.fixedRemain=sum(m.fixed,function(x){return x.paid?0:x.planned});
  r.fixedProj=r.fixedPaid+r.fixedRemain;
  var FK=m.fixed.filter(function(x){return !isX(x)}),FX=m.fixed.filter(isX);
  r.kPlanned=sum(FK,function(x){return x.planned});r.kPaid=sum(FK,function(x){return x.paid?x.actual:0});r.kRemain=sum(FK,function(x){return x.paid?0:x.planned});
  r.xPlanned=sum(FX,function(x){return x.planned});r.xPaid=sum(FX,function(x){return x.paid?x.actual:0});r.xRemain=sum(FX,function(x){return x.paid?0:x.planned});
  r.coursesPlanned=m.courses.planned||0;
  r.coursesSpent=sum(m.extras.filter(function(e){return e.cat==='Courses'||e.cat==='Extra'}),function(e){return e.amount});
  r.restoPlanned=restoOf(m);
  r.restoSpent=sum(m.extras.filter(function(e){return e.cat===RESTO}),function(e){return e.amount});
  r.otherExtras=sum(m.extras.filter(function(e){return e.cat!=='Courses'&&e.cat!=='Extra'&&e.cat!==RESTO}),function(e){return e.amount});
  r.extrasTotal=r.coursesSpent+r.otherExtras;
  r.coursesProj=Math.max(r.coursesPlanned,r.coursesSpent);
  r.marginPlanned=r.creditsPlanned-r.fixedPlanned-r.coursesPlanned;
  r.balanceNow=r.creditsReal-r.fixedPaid-r.extrasTotal;
  r.proj=r.incProj-r.fixedProj-r.coursesProj-r.otherExtras;
  return r;
}

/* ---------- persistance ---------- */
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({config:state.config,months:state.months}))}catch(e){}}

  }catch(e){}
}

function applyModel(){try{if(localStorage.getItem('budget-model-v')==='2')return;var F=[['loyer','Loyer','Logement',1461.72],['credit-regroupe','Crédit regroupé (Sofinco)','Crédits & leasing',715.86],['leasing','Leasing T-Cross','Crédits & leasing',298.27],['caf-dette','Compensation dette CAF','Crédits & leasing',110],['ass-tcross','Assurance T-Cross','Assurances',138],['ass-bmw','Assurance BMW','Assurances',102.77],['ass-hab','Assurance habitation','Assurances',14.59],['elec','Électricité','Énergie & télécom',150],['internet','Internet (Bouygues)','Énergie & télécom',36.99],['tel-enfant','Téléphone Rafaelle','Énergie & télécom',23.98],['cantine','Cantine + accueil primaire','Enfants & école',209.22],['demi-pension','Collège demi-pension','Enfants & école',76.66],['musique','Musique enfant','Enfants & école',120],['tresorerie','Trésorerie famille (Sakafo)','Famille',50]];state.config.fixed=F.map(function(f){return {id:f[0],label:f[1],group:f[2],amount:f[3]}});state.config.credits=[{id:'paf-hasina-1',kind:'paf1',label:'PAF Hasina – 1er du mois',who:'Hasina',amount:0},{id:'paf-hasina-2',kind:'paf2',label:'PAF Hasina – solde du 10',who:'Hasina',amount:0},{id:'paf-linda',kind:'paf',label:'PAF Linda',who:'Linda',amount:0}];state.config.courses=500;state.config.incomes=[3245.5,1550];state.config.salaryFirst=2500;Object.keys(state.months).forEach(function(k){if(k<ym)return;var m=state.months[k];(m.fixed||[]).forEach(function(x){if(x.tid==='ass-bmw'&&!x.paid){x.planned=102.77;x.actual=102.77}});m.credits=(m.credits||[]).filter(function(c){return !(c.tid==='caf'&&!c.done)})});localStorage.setItem('budget-model-v','2');persistLocal()}catch(e){}}
function docFor(id){return id==='config'?state.config:state.months[id.slice(2)]}
function setStatus(s){if(state.status!==s){state.status=s;paintStatus()}}
function touch(id){
  var dd=docFor(id);if(dd)dd._ts=Date.now();
  persistLocal();
  if(!col){paintStatus();schedSync();return}
  dirty[id]=true; clearTimeout(timers[id]);
  setStatus('saving');
  timers[id]=setTimeout(function(){flush(id)},600);
}
function flush(id){
  if(busy[id]){timers[id]=setTimeout(function(){flush(id)},400);return}

  dirty[id]=false; delete timers[id]; busy[id]=true;
  var body=docFor(id); if(!body){busy[id]=false;return}

    busy[id]=false;
    if(!Object.keys(dirty).some(function(k){return dirty[k]})&&!Object.keys(busy).some(function(k){return busy[k]}))setStatus('saved');
  }).catch(function(e){
    busy[id]=false;
    if(e&&e.code==='invalid_argument'){setStatus('ro')}else{dirty[id]=true;setStatus('error')}
  });
}
function applySnap(snap){
  snap.docChanges().forEach(function(ch){
    var id=ch.doc.id;
    if(timers[id]||busy[id]||dirty[id])return;
    if(ch.type==='removed'){if(id.indexOf('m-')===0)delete state.months[id.slice(2)];return}
    var d=ch.doc.data(); if(!d)return;
    if(id==='config'){state.config=normCfg(d);resetVirt()}
    else if(id.indexOf('m-')===0){var k=id.slice(2);state.months[k]=normMonth(d,k);delete virt[k]}

function initDb(){

    if(!db){setStatus('local');return}
    col=db.collection('budget');
    var live=false;
    var t=setTimeout(function(){if(!live)setStatus('stale')},10000);
    col.onSnapshot(function(snap){
      applySnap(snap);
      if(!snap.metadata.fromCache){live=true;clearTimeout(t);if(state.status==='loading'||state.status==='stale')state.status='saved'}
      render();
    },function(err){
      clearTimeout(t);
      setStatus(err&&err.code==='revoked'?'ro':'stale');

function paintStatus(){var el=$('#status');if(!el)return;

function findBy(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}

function nsSync(){
  var N=nsd(),led={},cc=false,mm={},ex={};
  N.ledger.forEach(function(x){led[x.id]=x});
  Object.keys(state.months).forEach(function(k){var m=state.months[k],keep=[],c=false;
    (m.fixed||[]).forEach(function(f){
      if(!f.nid){keep.push(f);return}
      var x=led[f.nid];
      if(f.paid){if(x&&!x.done&&x.owe==='b'){x.done=true;x.doneIn=k;cc=true}ex[f.nid]=1;keep.push(f);return}
      if((!x&&N.del.indexOf(f.nid)>=0)||(x&&x.owe!=='b')){c=true;return}
      if(x){var a=Math.round(num(x.amount)*100)/100;if(num(f.planned)!==a){f.planned=a;f.actual=a;c=true}}
      ex[f.nid]=1;keep.push(f)});
    if(c){m.fixed=keep;mm[k]=1}});
  N.ledger.forEach(function(x){
    if(x.owe!=='b'||x.xt||ex[x.id])return;
    var d=String(x.date||'').slice(0,7);if(!/^\d{4}-\d{2}$/.test(d))return;
    var tk=shiftYm(d,1);if(tk<CUR)tk=CUR;
    var a=Math.round(num(x.amount)*100)/100;
    editM(tk).fixed.push({id:uid(),nid:x.id,label:x.label+' (avance '+nsName(x.by)+')',group:'Extra',planned:a,actual:a,paid:false,xtra:true});
    x.xt=tk;cc=true;mm[tk]=1});
  Object.keys(mm).forEach(function(k){touch('m-'+k)});if(cc)touch('config');
}

var pe={sub:'apercu',key:null,doc:null,st:null,tx:null,bal:null,fetched:null,msg:'',busy:false,loaded:false};

  if(!d||typeof d.ts!=='number'||!d.data)d={ts:0,data:{}};pe.doc=peFix(d)}
function peFix(d){var x=d.data;x.incomes=Array.isArray(x.incomes)?x.incomes:[];x.fixed=Array.isArray(x.fixed)?x.fixed:[];x.env=(x.env&&typeof x.env==='object')?x.env:{};x.tx=(x.tx&&typeof x.tx==='object')?x.tx:{};x.paid=(x.paid&&typeof x.paid==='object')?x.paid:{};x.rules=(x.rules&&typeof x.rules==='object')?x.rules:{};return d}
peNorm();
function peStore(){try{localStorage.setItem('budget-perso-v1',JSON.stringify(pe.doc))}catch(e){}}
function peCall(path,opts){
  opts=opts||{};var h={'Content-Type':'application/json'};if(bank.token)h.Authorization='Bearer '+bank.token;if(pe.key)h['X-Perso']=pe.key;opts.headers=h;
  return fetch(BANK_API+path,opts).then(function(r){return r.json().then(function(d){
    if(r.status===403&&d&&d.error==='perso_verrouille'){pe.key=null;try{localStorage.removeItem('budget-perso-key')}catch(e){}}
    return {ok:r.ok,status:r.status,d:d}})});
}
function peFail(){pe.busy=false;pe.msg='Passerelle injoignable. Vérifie ta connexion.';render()}
function peSave(){pe.doc.ts=Date.now();peStore();if(pe.key)peCall('/perso/doc',{method:'POST',body:JSON.stringify({doc:pe.doc})}).catch(function(){});render()}
function peLoad(){
  if(!pe.key||!bank.token)return;pe.busy=true;render();
  peCall('/perso/doc').then(function(x){
    if(x.ok&&x.d.doc&&typeof x.d.doc.ts==='number'&&x.d.doc.ts>pe.doc.ts){pe.doc=peFix(x.d.doc);peStore()}
    else if(x.ok&&pe.doc.ts>0&&(!x.d.doc||pe.doc.ts>x.d.doc.ts))peCall('/perso/doc',{method:'POST',body:JSON.stringify({doc:pe.doc})}).catch(function(){});
    return peCall('/perso/status')}).then(function(x){
    pe.busy=false;if(x.ok){pe.st=x.d;pe.msg='';render();if(x.d.linked&&!x.d.expired)peTx(false)}
    else{pe.msg=pe.key?'Impossible de lire le compte perso ('+(x.d&&x.d.error||x.status)+').':'Mot de passe perso incorrect.';render()}}).catch(peFail);
}
function peTx(force){
  pe.busy=true;render();
  peCall('/perso/transactions'+(force?'?refresh=1':'')).then(function(x){
    pe.busy=false;
    if(x.ok){pe.tx=x.d.transactions||[];pe.bal=x.d.balance||null;pe.fetched=x.d.fetched_at;pe.hist=x.d.from||null;pe.histFb=x.d.fallback?1:0;pe.msg=''}
    else pe.msg=x.d&&x.d.error==='consentement_expire'?'Le consentement a expiré : reconnecte la Société Générale.':'Impossible de récupérer les opérations ('+(x.d&&x.d.error||x.status)+(x.d&&x.d.detail?' : '+(typeof x.d.detail==='string'?x.d.detail:JSON.stringify(x.d.detail)).slice(0,160):'')+').';
