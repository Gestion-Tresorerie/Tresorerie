/* Synthèse : relief, anneaux, courbe */
:root{--bgov:rgba(232,237,247,.62);--gk:0;--gl1:rgba(255,255,255,.74);--gl2:rgba(255,255,255,.46);--gl-edge:rgba(40,60,100,.12);--gl-hi:rgba(255,255,255,.9);--gl-sh:0 6px 22px rgba(40,60,110,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bgov:rgba(8,12,26,.46);--gk:1;--gl1:rgba(255,255,255,.10);--gl2:rgba(255,255,255,.03);--gl-edge:rgba(255,255,255,.12);--gl-hi:rgba(255,255,255,.16);--gl-sh:0 10px 30px rgba(0,0,0,.32)}}
:root[data-theme="dark"]{--bgov:rgba(8,12,26,.46);--gk:1;--gl1:rgba(255,255,255,.10);--gl2:rgba(255,255,255,.03);--gl-edge:rgba(255,255,255,.12);--gl-hi:rgba(255,255,255,.16);--gl-sh:0 10px 30px rgba(0,0,0,.32)}
.syn .card,.syn .rtile{background:linear-gradient(160deg,var(--gl1),var(--gl2));border:1px solid var(--gl-edge);box-shadow:var(--gl-sh),inset 0 1px 0 var(--gl-hi);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
.syn .hero.glow{--glow:var(--good);padding-bottom:12px;box-shadow:var(--gl-sh),0 0 44px color-mix(in srgb,var(--glow) calc(var(--gk)*22%),transparent),inset 0 1px 0 var(--gl-hi)}
.syn .hero.gneg{--glow:var(--bad)}

.spark{margin-top:8px;overflow:visible}

.rtile .rwrap,.rtile .ring{width:84px;height:84px}.rtile .rv{font-size:11.5px;letter-spacing:-.2px}.rtile .rs{font:500 11px var(--mono);color:var(--muted);margin-top:2px;opacity:.85}.rtile .rl{font-size:12px;margin-top:8px}

@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

}

.head .brand{justify-self:start;align-self:center;line-height:0}
.head .brand img{display:block;margin-left:-6px}
.head .monthnav{justify-self:center;gap:0}
.head .monthnav .ib{width:34px;height:40px;flex:none}
.head .monthnav h1{width:114px;min-width:0;padding:0;white-space:nowrap;font-size:15px;line-height:1;text-align:center}
.head #status{justify-self:end;max-width:100%;min-width:0;font-size:11.5px;padding:6px 8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
/* Charges : même UX que Synthèse */
.fxh{display:flex;align-items:center;gap:16px}
.fxh .rwrap{flex:none}
.fxh .stat{min-width:0}
.lbl2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bigv{font:600 24px var(--mono);margin:4px 0 2px;letter-spacing:-.02em}
.bigv .muted{font-size:14px;font-weight:400}
.syn .grp{margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line);align-items:center}
.syn .grp b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.syn .grp .gc{margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);font-size:11px;letter-spacing:0;color:var(--ink)}
.syn .grp .n{font-size:14px;color:var(--ink)}
.syn .row{border-top:0;border-bottom:1px solid var(--line)}
.syn .row:last-child{border-bottom:0}
.row .nm{display:block;font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.row.is-done .nm{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;line-height:1.25;padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-weight:500;color:var(--muted)}
.tag.tg{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.tag.tw{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tag.tb{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.lnk{background:transparent;border:1px dashed var(--border-strong,var(--line));color:var(--accent)}
.form .add{grid-column:1/-1;justify-self:end;width:auto;min-height:40px;padding:8px 22px;font-size:14px;border-radius:12px}
.head .monthnav h1{width:132px}
/* Tous les onglets : même UX */
.syn .kpi,.syn .hrow{background:linear-gradient(160deg,var(--gl1),var(--gl2));border:1px solid var(--gl-edge);box-shadow:var(--gl-sh),inset 0 1px 0 var(--gl-hi);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px}
.syn .kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.syn .kpi .v{font-family:var(--mono);font-weight:600}
.line .nm{display:block;font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.line .t{min-width:0}
.syn .btn{min-height:40px;padding:8px 16px;font-size:14px;border-radius:12px;font-weight:500}
.syn .btn.mini{min-height:0;padding:4px 10px;font-size:12px;border-radius:8px}
.syn .form .btn.full{grid-column:1/-1;width:auto;justify-self:end;padding:8px 22px}
.syn .chip.seg{font-size:13px;padding:6px 12px}
.grid2>*{min-width:0}
.grid2 input{width:100%;min-width:0}
.ro [data-ed],.ro [data-lk],.ro [data-fx],.ro [data-bs],.ro [data-act="del"]{pointer-events:none}
.ro input:disabled,.ro select:disabled{opacity:.8;-webkit-text-fill-color:currentColor}
.ro .btn:disabled,.ro .x:disabled{opacity:.4}
.kp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kp3 .kpi{padding:10px}.kp3 .kpi .v{font-size:15px}
.msec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 4px 2px}
.mgh{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;background:none;border:0;padding:2px 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mgh>span:first-child{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mgh .gc{margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);font-size:11px;letter-spacing:0}
.mgh .n{font:600 14px var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chev{display:inline-block;font-size:18px;color:var(--muted);transform:rotate(90deg);transition:transform .2s;margin-left:4px}.chev.up{transform:rotate(-90deg)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{margin-top:8px}.mrow .t{display:flex;flex-direction:column;gap:5px;min-width:0}.mrow .nm{font-weight:600;font-size:15px;line-height:1.25}.mrow .n{font:600 15px var(--mono);white-space:nowrap}
.edsh{display:grid;gap:8px;padding:4px 0 14px}.edsh .edbt{display:flex;gap:8px}
input.num,.row input.num,input[name=amount]{min-height:34px;height:34px;padding:0 10px;font-size:16px;line-height:1;border-radius:8px;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:none}
input.num:focus,input[name=amount]:focus{background:color-mix(in srgb,var(--ink) 10%,transparent);border-color:var(--accent)}
.row{min-height:52px;padding:8px 0}
.kp3{align-items:stretch}
.form input:not([type=hidden]),.form select{height:40px;min-height:40px;padding:0 12px;border-radius:10px;font-size:16px;background:var(--bg);border:1px solid var(--line)}
.form input[type=date]{padding:0 10px}
.adh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;min-height:34px}
.adh>span:first-child{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.adb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.ad .adbody{margin-top:12px}.ad:not(.open) .adbody{display:none}
.card.ad{padding-top:12px;padding-bottom:12px}.card.ad.open{padding-bottom:16px}
.adin{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.rings.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.envt{cursor:default;padding:14px 8px 12px}
.envin{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
.envin input.num{width:88px;min-height:32px;height:32px;padding:0 8px;font-size:15px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hyr{width:auto;min-height:32px;height:32px;padding:0 28px 0 12px;font-size:14px;border-radius:16px}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

var EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var fmt=function(n){return EUR.format(Math.round((n||0)*100)/100)};
var sgn=function(n){return (n>0?'+':'')+fmt(n)};
var num=function(v){var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
var inp=function(v){return String(Math.round((v||0)*100)/100).replace('.',',')};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var GROUPS=['Logement','Voiture','Énergie & télécom','Enfants & école','Famille','Ponctuel'];
var GMAP={loyer:'Logement','ass-hab':'Logement','credit-regroupe':'Voiture',leasing:'Voiture','ass-tcross':'Voiture','ass-bmw':'Voiture','caf-dette':'Ponctuel'};
function ngrp(g,tid,lb){if(tid&&GMAP[tid])return GMAP[tid];if(!tid&&lb&&g!=='Extra'){if(/dette caf|compensation/i.test(lb))return 'Ponctuel';if(/t-?cross|bmw|sofinco|cr[ée]dit regroup|leasing/i.test(lb))return 'Voiture';if(/loyer|habitation/i.test(lb))return 'Logement'}return g==='Divers'?'Ponctuel':g}
var RESTO='Ticket resto';
var CATS=['Courses','Ticket resto','Enfants & école','Santé','Loisirs','Transport','Exceptionnel','Autre'];
var STATUS={
  loading:{cls:'',txt:'Chargement…'}, saved:{cls:'ok',txt:'Enregistré'}, saving:{cls:'',txt:'Enregistrement…'},
  local:{cls:'warn',txt:'Local à cet appareil'}, stale:{cls:'warn',txt:'Données peut-être anciennes'},
  error:{cls:'bad',txt:'Échec d’enregistrement'}, ro:{cls:'warn',txt:'Lecture seule'}
};
var LS='budget-foyer-v1';

var NOTES={'internet':'Avancé par Hasina · payé au virement','tel-enfant':'Avancé par Hasina · payé au virement'};
var d0=new Date();
var ym=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0');
var state={config:{contributors:['Hasina','Linda'],courses:500,resto:60,fixed:[],credits:[],incomes:[3245.5,1550],firstPayment:1700,salaryFirst:2500},months:{},tab:'synthese',status:'loading'};
var virt={}; var col=null;
var timers={},busy={},dirty={};

function ymLabel(s){var p=s.split('-');return MOIS[+p[1]-1]+' '+p[0]}
function shiftYm(s,k){var p=s.split('-');var d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function clone(o){return JSON.parse(JSON.stringify(o))}
function normNous(n){n=n||{};return {ledger:Array.isArray(n.ledger)?n.ledger:[],pots:(n.pots&&typeof n.pots==='object'&&!Array.isArray(n.pots))?n.pots:{},del:Array.isArray(n.del)?n.del:[]}}
function nsd(){if(!state.config.nous)state.config.nous=normNous();return state.config.nous}
function cfgMerge(l,r,rNewer){var w=clone(rNewer?r:l),o=rNewer?l:r,a=normNous(w.nous),b=normNous(o.nous),dead={};
  a.del.concat(b.del).forEach(function(k){dead[k]=1});
  function un(x,y){var out=(x||[]).filter(function(e){return !dead[e.id]}),h={};out.forEach(function(e){h[e.id]=1});(y||[]).forEach(function(e){if(!h[e.id]&&!dead[e.id])out.push(e)});return out}
  a.ledger=un(a.ledger,b.ledger);Object.keys(b.pots).forEach(function(k){a.pots[k]=un(a.pots[k],b.pots[k])});Object.keys(a.pots).forEach(function(k){a.pots[k]=un(a.pots[k],[])});
  a.del=Object.keys(dead).slice(-500);w.nous=a;return w}
function normCfg(d){
  var c=clone(d||{});
  return {contributors:Array.isArray(c.contributors)&&c.contributors.length?c.contributors:['Hasina','Linda'],
    courses:typeof c.courses==='number'?c.courses:500, resto:typeof c.resto==='number'?c.resto:60,
    fixed:Array.isArray(c.fixed)?c.fixed:[], credits:Array.isArray(c.credits)?c.credits:[],
    incomes:Array.isArray(c.incomes)?[num(c.incomes[0]),num(c.incomes[1])]:[3245.5,1550],
    firstPayment:typeof c.firstPayment==='number'?c.firstPayment:1700,salaryFirst:typeof c.salaryFirst==='number'?c.salaryFirst:2500,_ts:typeof c._ts==='number'?c._ts:0,nous:normNous(c.nous)};
}
function normMonth(d,key){
  var m=clone(d||{});
  m.ym=key; m.courses=m.courses||{planned:state.config.courses};
  m.credits=m.credits||[]; m.fixed=m.fixed||[]; m.extras=m.extras||[];
  return m;
}
function build(key){
  var c=state.config;
  return {ym:key,courses:{planned:c.courses},
    credits:c.credits.map(function(t){return {id:uid(),tid:t.id,label:t.label,who:t.who,planned:t.amount||0,actual:t.kind?null:t.amount,done:false,kind:t.kind||null}}),
    fixed:c.fixed.filter(function(t){return tplOn(t,key)}).map(function(t){return {id:uid(),tid:t.id,label:t.label,group:t.group,planned:t.amount,actual:t.amount,paid:false}}),
    extras:[]};
}
function tplEnd(t){return t.from&&t.months?shiftYm(t.from,t.months-1):null}
function tplOn(t,key){return !t.from||(key>=t.from&&(!t.months||key<=tplEnd(t)))}
var fxAdd=false;
function adIn(t){return '<div class="ad adin"><button type="button" class="adh" data-ad="pot" aria-expanded="false"><span>'+t+'</span><span class="adb" aria-hidden="true">+</span></button><div class="adbody">'}
function adOpen(k,t,o){return '<section class="card ad'+(o?' open':'')+'"><button type="button" class="adh" data-ad="'+k+'" aria-expanded="'+(o?'true':'false')+'"><span>'+t+'</span><span class="adb" aria-hidden="true">'+(o?'×':'+')+'</span></button><div class="adbody">'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-ad]');if(!b||b.disabled)return;var c=b.closest('.ad'),o=c.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');b.querySelector('.adb').textContent=o?'×':'+';if(o){var i=c.querySelector('input:not([type=hidden])');if(i)i.focus()}});
function getM(key){return state.months[key]||virt[key]||(virt[key]=build(key))}
function editM(key){
  if(!state.months[key]){state.months[key]=virt[key]||build(key);delete virt[key]}
  return state.months[key];
}
/* report automatique : ligne fixe non payée d'un mois passé -> mois courant, jusqu'à ce qu'elle soit cochée */
var CUR=ym;
function carryFor(key){
  var out={},inc=[],from={},outN=0;
  Object.keys(state.months).forEach(function(j){
    state.months[j].fixed.forEach(function(x){
      if(j===key){
        if((!x.paid&&j<CUR)||(x.paid&&x.paidIn&&x.paidIn!==j)){out[x.id]=1;outN++}
      }else if(!x.paid){
        if(j<key&&key===CUR){inc.push(x);from[x.id]=j}
      }else if(x.paidIn===key){inc.push(x);from[x.id]=j}
    });
  });
  return {out:out,inc:inc,from:from,outN:outN};
}
function getV(key){
  var m=getM(key),cf=carryFor(key);
  var v={};Object.keys(m).forEach(function(k){v[k]=m[k]});
  v.fixed=m.fixed.filter(function(x){return !cf.out[x.id]}).concat(cf.inc);
  v.carry=cf.from;v.carriedOut=cf.outN;
  return v;
}
function resetVirt(){Object.keys(virt).forEach(function(k){delete virt[k]})}

/* ---------- calculs ---------- */
function isX(x){return x.xtra===true||(!x.tid&&x.xtra!==false&&!/^s\d{6}\d+$/.test(x.id||'')&&!/demi.?pension|cantine/i.test(x.label||''))}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function shares(m){
  var cfg=state.config;
  var base=sum(m.fixed,function(x){return x.planned})+(m.courses.planned||0);
  var mi=(m.incomes&&m.incomes.length===2)?m.incomes:cfg.incomes;
  var i0=num(mi[0]),i1=num(mi[1]),tot=i0+i1,known=tot>0;
  var p0=known?i0/tot:0.5;
  var s0=Math.round(base*p0*100)/100,s1=Math.round((base-s0)*100)/100;

/* ---- Rapprochement bancaire ---- */
function bkNorm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase()}
var BK_FIX=[['tel-enfant',/TELEPHONE|TEL RAF|RAFAELLE.*BOUYGUES|BOUYGUES.*RAFAELLE/],['internet',/BOUYGUES|INTERNET|BBOX/],['loyer',/BL0945895|NEXITY|LOYER/],['credit-regroupe',/CA CONSUMER|CONSUMER FINANCE|CREDIT REGROUPE/],['leasing',/VOLKSWAGEN/],['ass-tcross',/TCROSS|T-CROSS|T CROSS/],['ass-bmw',/\bAXA\b/],['ass-hab',/ACHEEL/],['elec',/TOTAL ?ENERGIES|ELECTRICITE/],['cantine',/DDFIP|PRESTO|\bSGC\b|REST\.? ?SCOLAIRE|ALSH|CANTINE/],['musique',/CONSERVATOIRE|HECTOR/],['tresorerie',/SAKAFO|DADA|TRESO/]];
var BK_CAT=[['Courses',/SODISCA|AUCHAN|LIDL|CARREFOUR|SUPER U|MONOPRIX|ALDI|INTERMARCHE|GRAND FRAIS|CASINO|BOULANGERIE|MARCHE|COURSES|PARIS STORE|FRANPRIX|BIOCOOP|SOLIBE/],['Santé',/PHARM|DOCTEUR|\bDR\b|ORTHO|CLINIQUE|OPHTAL|DOCTOLIB|RADIO|NOVEOC|CPAM|MEDECIN|LABORATOIRE/],['Transport',/\bTAM\b|VOIRIE|STATIONNEMENT|PARK|PEAGE|CARBURANT|STATION|SNCF|UBER/],['Enfants & école',/ECOLE|COLLEGE|PHOTO|SCOLAIRE/],['Loisirs',/RESTAU|CINE|AMIKADO|NETFLIX|SPOTIFY|BETM|ACTION|FNAC|AMAZON|KAYAK|CHINA|WOK|PIZZ|KEBAB|BURGER|MCDO|SUSHI|TACOS|PRIMARK|KIABI|DECATHLON/]];
var BK_PART={loyer:1},BK_BACK={};
var BK_MONTHS={JANV:1,JANVIER:1,FEV:2,FEVR:2,FEVRIER:2,MARS:3,AVR:4,AVRIL:4,MAI:5,JUIN:6,JUIL:7,JUILLET:7,AOUT:8,SEPT:9,SEPTEMBRE:9,OCT:10,OCTT:10,OCTOBRE:10,NOV:11,NOVEMBRE:11,DEC:12,DECEMBRE:12};
function bkMonthKey(t){
  var d=t.date||'',base=d.slice(0,7);if(!/^\d{4}-\d{2}$/.test(base))return null;
  var L=bkNorm(t.label),m=/\b(JANV(?:IER)?|FEV(?:R(?:IER)?)?|MARS|AVR(?:IL)?|MAI|JUIN|JUIL(?:LET)?|AOUT|SEPT(?:EMBRE)?|OCT(?:T|OBRE)?|NOV(?:EMBRE)?|DEC(?:EMBRE)?)\b/.exec(L);
  if(!m){if(t.amount>0&&/\bPAF\b/.test(L)&&+d.slice(8,10)>=25)return shiftYm(base,1);return base}
  var mo=BK_MONTHS[m[1]],by=+base.slice(0,4),bm=+base.slice(5,7),y=by;
  if(mo<bm-6)y=by+1;else if(mo>bm+6)y=by-1;
  var diff=(y*12+mo)-(by*12+bm);
  if(diff!==0&&diff!==1)return base;
  return y+'-'+(mo<10?'0':'')+mo;

function bkClassify(t){
  var L=bkNorm(t.label);
  if(t.amount>0){
    if(/\bPAF\b|PARTICIP/.test(L))return {k:'paf',who:/LINDA|MADAME|\bMME\b/.test(L)?'Linda':'Hasina'};

  var cat='Autre';for(var j=0;j<BK_CAT.length;j++)if(BK_CAT[j][1].test(L)){cat=BK_CAT[j][0];break}

function bankSync(){
  var s={ticked:0,pafs:0,credits:0,extras:0},touched={};
  var list=(bank.tx||[]).filter(function(t){return !t.pending&&t.id&&t.amount}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)});
  list.forEach(function(t){
    var key=bkMonthKey(t);if(!key)return;

      if(cr){cr.done=true;cr.actual=amt;cr.bank=true;s.pafs++;done=true}
      else{var last=null;m.credits.forEach(function(y){if(c.who==='Linda'?(y.kind==='paf'&&y.who==='Linda'):y.kind==='paf2')last=y});

document.addEventListener('click',function(e){
  var t=e.target.closest('button[data-ns]');if(!t)return;var N=nsd(),id=t.dataset.id;
  if(t.dataset.ns==='del'){N.ledger=N.ledger.filter(function(x){return x.id!==id});N.del=N.del.concat([id]).slice(-500);commitCfg()}
  else if(t.dataset.ns==='pdel'){var pl=N.pots[t.dataset.pid]||[];N.pots[t.dataset.pid]=pl.filter(function(x){return x.id!==id});N.del=N.del.concat([id]).slice(-500);commitCfg()}
});
document.addEventListener('submit',function(e){
  var form=e.target.closest('[data-form]'); if(!form)return;
  e.preventDefault();
  var fd=new FormData(form),k=form.dataset.form;
  var label=String(fd.get('label')||'').trim(), amount=num(fd.get('amount'));
  if(!label)return;
  if(k==='add-fixed'){editM(ym).fixed.push({id:uid(),label:label,group:fd.get('group'),planned:amount,actual:amount,paid:false});commitM()}
  else if(k==='add-credit'){editM(ym).credits.push({id:uid(),label:label,who:fd.get('who'),planned:amount,actual:amount,done:false});commitM()}
  else if(k==='add-extra'){editM(ym).extras.push({id:uid(),label:label,cat:fd.get('cat'),amount:amount,date:fd.get('date')});commitM()}
  else if(k==='ns-add'){var by=fd.get('by'),ow=fd.get('owe');
    if(ow!=='b'&&ow===by){nsErr='Celui qui avance ne peut pas être celui qui rembourse.';render();return}
    nsErr='';nsd().ledger.push({id:uid(),label:label,date:fd.get('date')||d0.toISOString().slice(0,10),amount:amount,by:by,owe:ow,done:false});commitCfg()}
  else if(k==='ns-pot'){var pid=String(fd.get('pid')||''),pl=nsd().pots[pid]||(nsd().pots[pid]=[]);
    pl.push({id:uid(),label:label,date:fd.get('date')||d0.toISOString().slice(0,10),amount:(fd.get('kind')==='in'?1:-1)*Math.abs(amount)});commitCfg()}
  else if(k==='add-rec'){var un=String(fd.get('until')||''),nm=null;if(/^\d{4}-\d{2}$/.test(un)){var pa=ym.split('-'),pb=un.split('-');nm=(+pb[0]-+pa[0])*12+(+pb[1]-+pa[1])+1;if(nm<1)nm=null}
    var tp={id:uid(),label:label,group:fd.get('group'),amount:amount,from:ym,months:nm};state.config.fixed.push(tp);
    var ks={};ks[ym]=1;Object.keys(state.months).forEach(function(q){if(tplOn(tp,q))ks[q]=1});
    Object.keys(ks).forEach(function(q){if(!tplOn(tp,q))return;var mq=editM(q);if(!mq.fixed.some(function(y){return y.tid===tp.id}))mq.fixed.push({id:uid(),tid:tp.id,label:tp.label,group:tp.group,planned:tp.amount,actual:tp.amount,paid:false});touch('m-'+q)});
    fxAdd=false;resetVirt();touch('config');render()}
  else if(k==='cfg-fixed'){state.config.fixed.push({id:uid(),label:label,group:fd.get('group'),amount:amount});commitCfg()}
  else if(k==='cfg-credit'){state.config.credits.push({id:uid(),label:label,who:fd.get('who'),amount:amount});commitCfg()}
});

function bankFix1(){try{if(localStorage.getItem('budget-fix-v')==='2')return;
  Object.keys(state.months).forEach(function(k){var m=state.months[k],add=[],ch=false;if(!m||!m.fixed)return;
    m.fixed.forEach(function(x){if(x.tid==='loyer'&&x.bank&&x.paid&&x.planned-x.actual>0.5){var r=Math.round((x.planned-x.actual)*100)/100;add.push({id:uid(),tid:'loyer',label:x.label+' (solde)',group:x.group,planned:r,actual:r,paid:false});x.planned=x.actual}});
    if(k==='2026-10'){var n0=m.fixed.length;m.fixed=m.fixed.filter(function(x){return !(x.tid==='cantine'&&!x.paid)});if(m.fixed.length!==n0)ch=true}
    (m.extras||[]).forEach(function(e){if(e.bankId&&e.cat==='Autre'){var c=bkClassify({amount:-1,label:e.label,date:(e.date||k+'-01')});if(c.k==='extra'&&c.cat!=='Autre'){e.cat=c.cat;ch=true}}});
    if(add.length){m.fixed=m.fixed.concat(add);ch=true}
    if(ch)touch('m-'+k)});
  localStorage.setItem('budget-fix-v','2');persistLocal()}catch(e){}}
function applyInc(){try{if(localStorage.getItem('budget-inc-v')==='1')return;var i=state.config.incomes;if(i&&Math.abs(num(i[0])-3322.64)<0.005){i[0]=3245.5;persistLocal();touch('config')}localStorage.setItem('budget-inc-v','1')}catch(e){}}
function migModel(){
  var cfg=state.config,ch=false;
  cfg.fixed.forEach(function(t){var g=ngrp(t.group,t.id);if(g!==t.group){t.group=g;ch=true}});
  if(ch)touch('config');
  Object.keys(state.months).forEach(function(k){
    var m=state.months[k],c2=false;if(!m||!m.fixed)return;
    m.fixed.forEach(function(x){if(x.group==='Extra')return;var g=ngrp(x.group,x.tid,x.label);if(g!==x.group){x.group=g;c2=true}});
    if(k>='2026-12'){var del=m.del||[];cfg.fixed.forEach(function(tp){
      if(!tplOn(tp,k)||m.fixed.some(function(y){return y.tid===tp.id})||del.indexOf(tp.id+'|'+tp.label)>=0)return;
      m.fixed.push({id:uid(),tid:tp.id,label:tp.label,group:tp.group,planned:tp.amount,actual:tp.amount,paid:false});c2=true})}
    if(c2)touch('m-'+k)});
}
loadLocal();applySeed();applyModel();bankFix1();applyInc();migModel();try{nsSync()}catch(e){}
(function(){var m=/#bank=(\w+)/.exec(location.hash||'');if(m){state.tab='banque';bank.msg=m[1]==='ok'?'':'La connexion à Fortuneo a échoué. Réessaie.';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}})();
render();
if(bank.token){bankLoad();setTimeout(function(){doSync(true)},1500);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&Date.now()-syLast>10000&&!sy.busy)doSync(true)});setInterval(function(){if(document.visibilityState==='visible'&&!sy.busy&&!typing()&&Date.now()-syLast>45000)doSync(true)},30000)}
initDb();
})();
</script>
