/* Direction : outil de pilotage mensuel, une colonne mobile, chiffres en mono, onglets en bas. */
:root{
  --page:#e8edf7; --o1:#8fb4ff; --o2:#c9a6ff; --o3:#ffd58a; --bg:rgba(255,255,255,.55); --surface:rgba(255,255,255,.58); --ink:#14202e; --muted:#51607a; --line:rgba(40,60,100,.16); --glass-b:rgba(255,255,255,.75); --shadow:0 8px 30px rgba(40,60,110,.14);

  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0a0f1d; --o1:#2f5fd0; --o2:#7a3fd0; --o3:#0f8f8a; --bg:rgba(255,255,255,.06); --surface:rgba(255,255,255,.07); --ink:#e9eef7; --muted:#a3b0c4; --line:rgba(255,255,255,.14); --glass-b:rgba(255,255,255,.16); --shadow:0 8px 30px rgba(0,0,0,.35);
    --accent:#7db0ff; --accent-ink:#0b1a30;
    --good:#5fd19a; --good-bg:#11291d; --warn:#f0b955; --warn-bg:#33270f; --bad:#ff8d82; --bad-bg:#37191a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0a0f1d; --o1:#2f5fd0; --o2:#7a3fd0; --o3:#0f8f8a; --bg:rgba(255,255,255,.06); --surface:rgba(255,255,255,.07); --ink:#e9eef7; --muted:#a3b0c4; --line:rgba(255,255,255,.14); --glass-b:rgba(255,255,255,.16); --shadow:0 8px 30px rgba(0,0,0,.35);
  --accent:#7db0ff; --accent-ink:#0b1a30;
  --good:#5fd19a; --good-bg:#11291d; --warn:#f0b955; --warn-bg:#33270f; --bad:#ff8d82; --bad-bg:#37191a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 520px at 8% 4%,var(--o1),transparent 70%),radial-gradient(560px 560px at 100% 28%,var(--o2),transparent 70%),radial-gradient(600px 600px at 20% 100%,var(--o3),transparent 70%);opacity:.55}
.glass,.card,.kpi,.hrow,header,.tabbar,.ib,.chip,.btn,.pill{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);min-height:100vh;font-family:var(--font);font-size:15px;line-height:1.4;padding-bottom:76px;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--glass-b)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand{flex:none}.brand img{width:34px;height:34px;flex:none;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav h1{font-size:17px;font-weight:600;margin:0;min-width:130px;text-align:center;text-transform:capitalize}
button{font:inherit;color:inherit}
.ib{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px;cursor:pointer}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--good);background:var(--good-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
main{padding:14px 0 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--glass-b);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 10px;text-transform:uppercase}
.hero{display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em}
.hero .sub{color:var(--muted);font-size:13px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.tap:active{opacity:.75}
.kpi{border:1px solid var(--glass-b);box-shadow:var(--shadow);border-radius:16px;padding:10px 12px;background:var(--surface)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:18px;font-weight:500;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}.bar.ok>i{background:var(--good)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12px}
.cols{display:grid;grid-template-columns:30px 1fr 82px 82px 28px;gap:6px;align-items:center;font-size:11px;color:var(--muted);padding:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cols span:nth-child(3),.cols span:nth-child(4){text-align:right}
.row{display:grid;grid-template-columns:30px 1fr 82px 82px 28px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.row.vr,.cols.vr{grid-template-columns:30px 1fr 96px 28px}
.row .t{overflow-wrap:anywhere;line-height:1.25}
.row .t small{display:block;color:var(--muted);font-size:11px}
.row.is-done .t{color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
input.num{text-align:right;font-family:var(--mono);font-size:14px;padding:7px 6px}
input:disabled{opacity:.45}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;justify-content:center;position:relative;width:30px;height:30px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;display:block;background:var(--bg)}
.chk input:checked+span{background:var(--good);border-color:var(--good)}
.chk input:checked+span::after{content:"";display:block;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(5px,1px) rotate(45deg)}
.chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.x{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:8px}
.x:hover{background:var(--bad-bg);color:var(--bad)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 4px}
.grp b{font-size:13px}
.grp .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.form .full{grid-column:1/-1}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--glass-b);display:flex;justify-content:center;z-index:6}
.tabbar nav{display:flex;width:100%;max-width:640px}
.tabbar button{flex:1;border:0;background:transparent;padding:12px 0 14px;font-size:10.5px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabbar button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.note{font-size:12px;padding:7px 9px;border-radius:8px;margin:6px 0}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)}
.pill{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:4px}
.share{padding:10px 0;border-top:1px solid var(--line)}
.hrow{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--glass-b);border-radius:14px;padding:10px 12px;cursor:pointer}
svg .axis{stroke:var(--line);stroke-width:1}
svg .b-pos{fill:var(--good);opacity:.55} svg .b-neg{fill:var(--bad);opacity:.55}
svg .proj{opacity:.28}
svg .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.cfgrow{display:grid;grid-template-columns:1fr 92px 28px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.cfgrow.fx{grid-template-columns:1fr 100px 78px 28px}
textarea{min-height:90px;font-family:var(--mono);font-size:12px}
@media (max-width:380px){.cols,.row{grid-template-columns:28px 1fr 72px 72px 24px}}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}

:root{--card:rgba(255,255,255,.88);--card-line:rgba(40,60,100,.12);--r:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:rgba(15,21,40,.86);--card-line:rgba(255,255,255,.10);--muted:#b8c3d6}}

body{font-size:16px;line-height:1.5;padding-bottom:96px}

.ib{width:40px;height:44px;border-radius:12px}

.card,.kpi,.hrow{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card);border:1px solid var(--card-line);box-shadow:none;border-radius:var(--r)}

var CUR=ym;
function carryFor(key){
  var out={},inc=[],from={},outN=0;
  Object.keys(state.months).forEach(function(j){
    state.months[j].fixed.forEach(function(x){
      if(j===key){

    });
  });

}

/* ---------- calculs ---------- */
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function shares(m){
  var cfg=state.config;
  var base=sum(m.fixed,function(x){return x.planned})+(m.courses.planned||0);
  var mi=(m.incomes&&m.incomes.length===2)?m.incomes:cfg.incomes;
  var i0=num(mi[0]),i1=num(mi[1]),tot=i0+i1,known=tot>0;
  var p0=known?i0/tot:0.5;
  var s0=Math.round(base*p0*100)/100,s1=Math.round((base-s0)*100)/100;
  var sf=num(cfg.salaryFirst),first=(i0>0&&sf>0)?Math.round(s0*Math.min(sf,i0)/i0*100)/100:s0;
  var l1=null;m.credits.forEach(function(x){if(x.kind==='paf1')l1=x});
  var firstUsed=(l1&&l1.done&&l1.actual!=null)?l1.actual:first;
  var second=Math.max(0,Math.round((s0-firstUsed)*100)/100);
  return {base:base,known:known,p:[p0,1-p0],share:[s0,s1],income:[i0,i1],first:first,firstUsed:firstUsed,second:second,salFirst:Math.min(num(cfg.salaryFirst),i0),salRest:Math.max(0,Math.round((i0-num(cfg.salaryFirst))*100)/100),over:[i0>0&&s0>i0,i1>0&&s1>i1]};
}
function eff(x,S){
  if(x.kind==='paf1')return S.first;
  if(x.kind==='paf2')return S.second;
  if(x.kind==='paf'){var i=state.config.contributors.indexOf(x.who);return S.share[i===0?0:1]}
  return x.planned;
}
function act(x,S){return x.actual!=null?x.actual:eff(x,S)}
function calc(m){
  var r={};var S=shares(m);r.S=S;
  r.creditsPlanned=sum(m.credits,function(x){return eff(x,S)});
  r.creditsReal=sum(m.credits,function(x){return x.done?act(x,S):0});
  r.incProj=sum(m.credits,function(x){return x.done?act(x,S):eff(x,S)});
  r.incProj+=sum(m.credits,function(x){return (x.kind&&x.done)?Math.max(0,eff(x,S)-act(x,S)):0});
  r.fixedPlanned=sum(m.fixed,function(x){return x.planned});
  r.fixedPaid=sum(m.fixed,function(x){return x.paid?x.actual:0});
  r.fixedRemain=sum(m.fixed,function(x){return x.paid?0:x.planned});
  r.fixedProj=r.fixedPaid+r.fixedRemain;
  r.coursesPlanned=m.courses.planned||0;
  r.coursesSpent=sum(m.extras.filter(function(e){return e.cat==='Courses'}),function(e){return e.amount});
  r.otherExtras=sum(m.extras.filter(function(e){return e.cat!=='Courses'}),function(e){return e.amount});
  r.extrasTotal=r.coursesSpent+r.otherExtras;
  r.coursesProj=Math.max(r.coursesPlanned,r.coursesSpent);
  r.marginPlanned=r.creditsPlanned-r.fixedPlanned-r.coursesPlanned;
  r.balanceNow=r.creditsReal-r.fixedPaid-r.extrasTotal;
  r.proj=r.incProj-r.fixedProj-r.coursesProj-r.otherExtras;
  return r;
}

function docFor(id){return id==='config'?state.config:state.months[id.slice(2)]}
function setStatus(s){if(state.status!==s){state.status=s;paintStatus()}}
function touch(id){
  var dd=docFor(id);if(dd)dd._ts=Date.now();
  persistLocal();
  if(!col){paintStatus();return}
  dirty[id]=true; clearTimeout(timers[id]);
  setStatus('saving');
  timers[id]=setTimeout(function(){flush(id)},600);
}
function flush(id){
  if(busy[id]){timers[id]=setTimeout(function(){flush(id)},400);return}
  if(!dirty[id])return;
  dirty[id]=false; delete timers[id]; busy[id]=true;
  var body=docFor(id); if(!body){busy[id]=false;return}
  col.doc(id).set(clone(body)).then(function(){
    busy[id]=false;
    if(!Object.keys(dirty).some(function(k){return dirty[k]})&&!Object.keys(busy).some(function(k){return busy[k]}))setStatus('saved');
  }).catch(function(e){
    busy[id]=false;
    if(e&&e.code==='invalid_argument'){setStatus('ro')}else{dirty[id]=true;setStatus('error')}
  });
}
function applySnap(snap){
  snap.docChanges().forEach(function(ch){
    var id=ch.doc.id;
    if(timers[id]||busy[id]||dirty[id])return;
    if(ch.type==='removed'){if(id.indexOf('m-')===0)delete state.months[id.slice(2)];return}
    var d=ch.doc.data(); if(!d)return;
    if(id==='config'){state.config=normCfg(d);resetVirt()}
    else if(id.indexOf('m-')===0){var k=id.slice(2);state.months[k]=normMonth(d,k);delete virt[k]}
  });
  persistLocal();
}
function initDb(){
  if(typeof claude==='undefined'||!claude||typeof claude.use!=='function'){setStatus('local');return}
  claude.use('db').then(function(db){
    if(!db){setStatus('local');return}
    col=db.collection('budget');
    var live=false;
    var t=setTimeout(function(){if(!live)setStatus('stale')},10000);
    col.onSnapshot(function(snap){
      applySnap(snap);
      if(!snap.metadata.fromCache){live=true;clearTimeout(t);if(state.status==='loading'||state.status==='stale')state.status='saved'}
      render();
    },function(err){
      clearTimeout(t);
      setStatus(err&&err.code==='revoked'?'ro':'stale');
    });
  }).catch(function(){setStatus('local')});
}

function hval(r){return r.open?r.c.proj:r.c.balanceNow}
function hChart(rows){
  var W=340,H=132,pad=8,lab=18,n=rows.length;
  var vals=rows.map(function(r){return hval(r)});
  var mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([-1])),rg=mx-mn;
  var ch=H-lab-2*pad, y=function(v){return pad+(mx-v)/rg*ch}, y0=y(0);
  var bw=Math.max(6,Math.min(30,(W-2*pad)/n-6)), step=(W-2*pad)/n;
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Solde réel par mois">'+
    '<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'" class="axis"/>';
  rows.forEach(function(r,i){
    var v=hval(r),yy=y(v),top=Math.min(yy,y0),h=Math.max(1.5,Math.abs(yy-y0));
    var x=pad+i*step+(step-bw)/2;
    out+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" class="'+(v>=0?'b-pos':'b-neg')+(r.open?' proj':'')+'"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" class="ax">'+MOIS[+r.k.slice(5)-1].slice(0,3)+'</text>';
  });
  return out+'</svg>';
}

function bkNorm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase()}
var BK_FIX=[['tel-enfant',/TELEPHONE|TEL RAF|RAFAELLE.*BOUYGUES|BOUYGUES.*RAFAELLE/],['internet',/BOUYGUES|INTERNET|BBOX/],['loyer',/BL0945895|NEXITY|LOYER/],['credit-regroupe',/CA CONSUMER|CONSUMER FINANCE|CREDIT REGROUPE/],['leasing',/VOLKSWAGEN/],['ass-tcross',/TCROSS|T-CROSS|T CROSS/],['ass-bmw',/\bAXA\b/],['ass-hab',/ACHEEL/],['elec',/TOTAL ?ENERGIES|ELECTRICITE/],['cantine',/DDFIP|PRESTO|\bSGC\b|REST\.? ?SCOLAIRE|ALSH|CANTINE/],['musique',/CONSERVATOIRE|HECTOR/],['tresorerie',/SAKAFO|DADA|TRESO/]];
var BK_CAT=[['Courses',/SODISCA|AUCHAN|LIDL|CARREFOUR|SUPER U|MONOPRIX|ALDI|INTERMARCHE|GRAND FRAIS|CASINO|BOULANGERIE|MARCHE|COURSES|PARIS STORE|FRANPRIX|BIOCOOP|SOLIBE/],['Santé',/PHARM|DOCTEUR|\bDR\b|ORTHO|CLINIQUE|OPHTAL|DOCTOLIB|RADIO|NOVEOC|CPAM|MEDECIN|LABORATOIRE/],['Transport',/\bTAM\b|VOIRIE|STATIONNEMENT|PARK|PEAGE|CARBURANT|STATION|SNCF|UBER/],['Enfants & école',/ECOLE|COLLEGE|PHOTO|SCOLAIRE/],['Loisirs',/RESTAU|CINE|AMIKADO|NETFLIX|SPOTIFY|BETM|ACTION|FNAC|AMAZON|KAYAK|CHINA|WOK|PIZZ|KEBAB|BURGER|MCDO|SUSHI|TACOS|PRIMARK|KIABI|DECATHLON/]];
var BK_PART={loyer:1},BK_BACK={};
var BK_MONTHS={JANV:1,JANVIER:1,FEV:2,FEVR:2,FEVRIER:2,MARS:3,AVR:4,AVRIL:4,MAI:5,JUIN:6,JUIL:7,JUILLET:7,AOUT:8,SEPT:9,SEPTEMBRE:9,OCT:10,OCTT:10,OCTOBRE:10,NOV:11,NOVEMBRE:11,DEC:12,DECEMBRE:12};
function bkMonthKey(t){
  var d=t.date||'',base=d.slice(0,7);if(!/^\d{4}-\d{2}$/.test(base))return null;
  var L=bkNorm(t.label),m=/\b(JANV(?:IER)?|FEV(?:R(?:IER)?)?|MARS|AVR(?:IL)?|MAI|JUIN|JUIL(?:LET)?|AOUT|SEPT(?:EMBRE)?|OCT(?:T|OBRE)?|NOV(?:EMBRE)?|DEC(?:EMBRE)?)\b/.exec(L);
  if(!m){if(t.amount>0&&/\bPAF\b/.test(L)&&+d.slice(8,10)>=25)return shiftYm(base,1);return base}
  var mo=BK_MONTHS[m[1]],by=+base.slice(0,4),bm=+base.slice(5,7),y=by;
  if(mo<bm-6)y=by+1;else if(mo>bm+6)y=by-1;
  var diff=(y*12+mo)-(by*12+bm);
  if(diff!==0&&diff!==1)return base;
  return y+'-'+(mo<10?'0':'')+mo;
}
function bkClassify(t){
  var L=bkNorm(t.label);
  if(t.amount>0){
    if(/\bPAF\b|PARTICIP/.test(L))return {k:'paf',who:/LINDA|MADAME|\bMME\b/.test(L)?'Linda':'Hasina'};
    return {k:'credit'};
  }
  for(var i=0;i<BK_FIX.length;i++)if(BK_FIX[i][1].test(L))return {k:'fixed',tid:BK_FIX[i][0]};
  var cat='Autre';for(var j=0;j<BK_CAT.length;j++)if(BK_CAT[j][1].test(L)){cat=BK_CAT[j][0];break}
  return {k:'extra',cat:cat};
}
function bankSync(){
  var s={ticked:0,pafs:0,credits:0,extras:0},touched={};
  var list=(bank.tx||[]).filter(function(t){return !t.pending&&t.id&&t.amount}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)});
  list.forEach(function(t){
    var key=bkMonthKey(t);if(!key)return;
    var ex=state.months[key];
    if(ex&&ex.imported)return;
    if(ex&&ex.bankSeen&&ex.bankSeen[t.id])return;
    var m=editM(key);m.bankSeen=m.bankSeen||{};m.bankSeen[t.id]=1;touched[key]=1;
    var c=bkClassify(t),amt=Math.abs(t.amount),done=false,i;
    if(t.amount<0&&/FORTUNEO/.test(bkNorm(t.label))&&/RASOL/.test(bkNorm(t.label))){
      var rdone=false,ra=m.fixed.filter(function(x){return !x.paid&&(x.tid==='internet'||x.tid==='tel-enfant')}),hit=[];
      ra.forEach(function(x){if(!hit.length&&Math.abs(x.planned-amt)<0.015)hit=[x]});
      if(!hit.length&&ra.length===2&&Math.abs(ra[0].planned+ra[1].planned-amt)<0.015)hit=ra;
      if(hit.length){hit.forEach(function(x){x.paid=true;x.actual=x.planned;x.bank=true;s.ticked++});rdone=true}
    }
    if(rdone)return;
    if(c.k==='fixed'){
      var ord=BK_BACK[c.tid]?Object.keys(state.months).filter(function(k){return k>='2026-10'&&k<=key}).sort():[key],tg=null,oi,mm;
      for(oi=0;oi<ord.length&&!tg;oi++){mm=(ord[oi]===key)?m:editM(ord[oi]);for(i=0;i<mm.fixed.length;i++)if(mm.fixed[i].tid===c.tid&&!mm.fixed[i].paid){tg=mm.fixed[i];touched[ord[oi]]=1;break}}
      if(tg){
        if(BK_PART[c.tid]&&tg.planned-amt>0.5){mm.fixed.push({id:uid(),tid:tg.tid,label:/\(solde\)/.test(tg.label)?tg.label:tg.label+' (solde)',group:tg.group,planned:Math.round((tg.planned-amt)*100)/100,actual:Math.round((tg.planned-amt)*100)/100,paid:false});tg.planned=amt}
        tg.paid=true;tg.actual=amt;tg.bank=true;s.ticked++;done=true}
      if(!done)c={k:'extra',cat:'Autre'};
    }else if(c.k==='paf'){
      var cr=null;
      for(i=0;i<m.credits.length&&!cr;i++){var x=m.credits[i];if(x.done)continue;
        if(c.who==='Linda'&&x.kind==='paf'&&x.who==='Linda')cr=x;
        else if(c.who==='Hasina'&&(x.kind==='paf1'||x.kind==='paf2'))cr=x}
      if(cr){cr.done=true;cr.actual=amt;cr.bank=true;s.pafs++;done=true}
      else{var last=null;m.credits.forEach(function(y){if(c.who==='Linda'?(y.kind==='paf'&&y.who==='Linda'):y.kind==='paf2')last=y});
        if(last&&last.done){last.actual=Math.round(((last.actual||0)+amt)*100)/100;last.bank=true;s.pafs++;done=true}else c={k:'credit'}};
    }
    if(!done&&c.k==='credit'){m.credits.push({id:uid(),label:String(t.label||'Crédit').slice(0,48),who:'Autre',planned:amt,actual:amt,done:true,kind:null,bank:true});s.credits++}
    else if(!done&&c.k==='extra'){m.extras.push({id:uid(),label:String(t.label||'Dépense').slice(0,48),cat:c.cat,amount:amt,date:t.date,bankId:t.id});s.extras++}
  });
  var ks=Object.keys(touched);
  if(ks.length){ks.forEach(function(k){touch('m-'+k)});resetVirt()}
  return s;
}

function syKey(x,l){return l==='extras'?(x.bankId?'b'+x.bankId:x.id):(x.tid?x.tid+'|'+x.label:x.id)}
function syMerge(a,b){var n=(a._ts||0)>=(b._ts||0)?[a,b]:[b,a],r=clone(n[0]),o=n[1],dead={};
  (a.del||[]).concat(b.del||[]).forEach(function(k){dead[k]=1});
